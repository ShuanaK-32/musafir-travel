<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Musafir Travels</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">
            <img src="logo.jpg" alt="Musafir Logo" class="nav-logo">
            Musafir Travels
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="search.html">Search Buses</a>
            <a href="bookings.html" class="active">My Bookings</a>
            <a href="refunds.html">Refunds & Cancel</a>
            <a href="offers.html">Offers & Wallet</a>
            <div id="nav-auth-links">
                <a href="login.html" class="btn-nav"><i class="fas fa-sign-in-alt"></i> Login / Signup</a>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <div style="background: var(--pure-black); color: white; padding: 3rem 20px; text-align: center;">
        <h1 style="font-size: 2.3rem; margin-bottom: 0.75rem;"><i class="fas fa-ticket-alt" style="color:var(--primary-red);"></i> My Bookings & E-Tickets</h1>
        <p style="color: #a0aec0; max-width: 600px; margin: 0 auto;">View your upcoming Maharashtra bus tickets, download receipts, or request cancellations.</p>
    </div>

    <!-- Main Container -->
    <div class="bookings-container">
        
        <div id="my-bookings-container">
            <!-- Bookings rendered dynamically by script.js from Database -->
        </div>

    </div>

    <!-- E-Ticket Modal -->
    <div id="ticket-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 820px;">
            <div class="modal-header">
                <h3>Booking Confirmation & E-Ticket</h3>
                <button class="btn-close" onclick="closeTicketModal()">&times;</button>
            </div>
            <div class="modal-body">
                
                <div id="ticket-print-area">
                    <!-- Ticket receipt generated dynamically -->
                </div>

                <div style="display: flex; gap: 15px; justify-content: flex-end; margin-top: 2rem;">
                    <button class="btn-secondary-sm" style="padding: 10px 20px;" onclick="printTicketVoucher()"><i class="fas fa-print"></i> Print / Download PDF</button>
                    <button class="btn-primary" onclick="closeTicketModal()">Close</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Musafir Travels. A College Sponsored Project.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
