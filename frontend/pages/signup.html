<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Musafir Travels</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">
            <img src="logo.jpg" alt="Musafir Logo" class="nav-logo">
            Musafir Travels
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="search.html">Search Buses</a>
            <a href="bookings.html">My Bookings</a>
            <a href="refunds.html">Refunds & Cancel</a>
            <a href="offers.html">Offers & Wallet</a>
            <div id="nav-auth-links">
                <a href="login.html" class="btn-nav"><i class="fas fa-sign-in-alt"></i> Login / Signup</a>
            </div>
        </div>
    </nav>

    <!-- Signup Container -->
    <div class="auth-container">
        <div class="auth-card" style="max-width: 480px;">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <h2 style="color: var(--pure-black); margin-bottom: 6px;">Create Your Account</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Join Musafir Travels for instant bookings and exclusive offers across Maharashtra.</p>
            </div>

            <!-- Error and Success Alerts -->
            <div id="signup-error-alert" style="display: none; background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; padding: 12px 16px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1.25rem;">
                <i class="fas fa-exclamation-circle" style="margin-right: 6px;"></i> <span id="signup-error-msg"></span>
            </div>
            
            <form onsubmit="handleSignup(event)">
                <div class="input-group" style="margin-bottom: 1.15rem;">
                    <label>Full Name *</label>
                    <input type="text" id="signup-name" placeholder="e.g. Rahul Sharma" required autocomplete="name">
                </div>

                <div class="input-group" style="margin-bottom: 1.15rem;">
                    <label>Email Address *</label>
                    <input type="email" id="signup-email" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="input-group" style="margin-bottom: 1.15rem;">
                    <label>Mobile Number *</label>
                    <input type="tel" id="signup-phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required autocomplete="tel">
                </div>

                <div class="input-group" style="margin-bottom: 1.15rem;">
                    <label>Password *</label>
                    <input type="password" id="signup-password" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
                </div>

                <div class="input-group" style="margin-bottom: 1.5rem;">
                    <label>Confirm Password *</label>
                    <input type="password" id="signup-confirm-password" placeholder="Re-enter your password" minlength="6" required autocomplete="new-password">
                </div>

                <button type="submit" id="btn-signup-submit" class="btn-primary" style="width: 100%; padding: 0.95rem; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.5px;">
                    CREATE ACCOUNT <i class="fas fa-user-plus"></i>
                </button>
            </form>
            
            <div class="divider">OR</div>

            <button class="btn-google" type="button" onclick="handleGoogleSignIn()">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo" style="height:20px;">
                Sign Up with Google
            </button>
            
            <div class="auth-links" style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
                Already have an account? <a href="login.html" style="color: var(--primary-red); font-weight: 700;">Login here</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Musafir Travels. A College Sponsored Project.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
