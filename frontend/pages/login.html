
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Musafir Travels</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Correct CSS path -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">
            <img src="../assets/Images/Musafir_logo.jpg" alt="Musafir Logo" class="nav-logo">
            <span>Musafir Travels</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="search.html">Search Buses</a>
            <a href="bookings.html">My Bookings</a>
            <a href="refunds.html">Refunds &amp; Cancel</a>
            <a href="offers.html">Offers &amp; Wallet</a>

            <div id="nav-auth-links">
                <a href="login.html" class="btn-nav">
                    <i class="fas fa-sign-in-alt"></i> Login / Signup
                </a>
            </div>
        </div>
    </nav>

    <!-- Login Container -->
    <main class="auth-container">
        <div class="auth-card">

            <!-- Login Role Selector -->
            <div style="display:flex;background:var(--off-white);padding:6px;border-radius:12px;margin-bottom:1.75rem;border:1px solid var(--border-color);">

                <button type="button" id="tab-btn-user" class="btn-primary"
                    style="flex:1;background:var(--primary-red);color:white;border-radius:8px;font-size:0.9rem;transition:all 0.25s ease;"
                    onclick="switchLoginMode('user')">
                    <i class="fas fa-user"></i> Customer Login
                </button>

                <button type="button" id="tab-btn-admin" class="btn-primary"
                    style="flex:1;background:transparent;color:var(--text-main);border-radius:8px;font-size:0.9rem;transition:all 0.25s ease;"
                    onclick="switchLoginMode('admin')">
                    <i class="fas fa-user-shield"></i> Admin Login
                </button>
            </div>

            <!-- Heading -->
            <div style="margin-bottom:1.5rem;text-align:center;">
                <h2 id="login-heading-txt" style="margin-bottom:6px;color:var(--pure-black);">
                    Customer Login
                </h2>
                <p id="login-subheading-txt" style="color:var(--text-muted);font-size:0.9rem;">
                    Sign in to access your bookings, tickets, and wallet
                </p>
            </div>

            <!-- Error Message -->
            <div id="login-error-alert" role="alert" aria-live="polite"
                style="display:none;background:#fee2e2;border:1px solid #ef4444;color:#b91c1c;padding:12px 16px;border-radius:8px;font-size:0.88rem;margin-bottom:1.25rem;">
                <i class="fas fa-exclamation-circle" style="margin-right:6px;"></i>
                <span id="login-error-msg"></span>
            </div>

            <!-- Login Form -->
            <form onsubmit="handleUserLogin(event)">
                <input type="hidden" id="login-role-mode" value="user">

                <div class="input-group" style="margin-bottom:1.25rem;">
                    <label for="login-email">Email Address or Username *</label>
                    <input type="text" id="login-email" name="email"
                        placeholder="Email or Username" required autocomplete="username">
                </div>

                <div class="input-group" style="margin-bottom:1.5rem;">
                    <label for="login-password">Password *</label>
                    <input type="password" id="login-password" name="password"
                        placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" id="btn-login-submit" class="btn-primary"
                    style="width:100%;padding:0.95rem;font-size:0.95rem;font-weight:700;letter-spacing:0.5px;">
                    SIGN IN <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Google Sign-In -->
            <div id="google-login-section">
                <div class="divider">OR</div>

                <button class="btn-google" type="button" onclick="handleGoogleSignIn()">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg"
                        alt="" style="height:20px;">
                    Continue with Google
                </button>
            </div>

            <!-- Signup Link -->
            <div class="auth-links" style="margin-top:1.5rem;text-align:center;font-size:0.9rem;">
                Don't have an account?
                <a href="signup.html" style="color:var(--primary-red);font-weight:700;">
                    Sign Up here
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Musafir Travels. A College Sponsored Project.</p>
        </div>
    </footer>

    <!-- Correct JavaScript path -->
    <script src="../js/script.js"></script>

    <!-- Login Mode Switching -->
    <script>
        function switchLoginMode(mode) {
            const userButton = document.getElementById('tab-btn-user');
            const adminButton = document.getElementById('tab-btn-admin');
            const roleInput = document.getElementById('login-role-mode');
            const heading = document.getElementById('login-heading-txt');
            const subheading = document.getElementById('login-subheading-txt');
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const googleSection = document.getElementById('google-login-section');
            const errorBox = document.getElementById('login-error-alert');
            const errorMessage = document.getElementById('login-error-msg');
            const submitButton = document.getElementById('btn-login-submit');

            mode = mode === 'admin' ? 'admin' : 'user';
            roleInput.value = mode;

            errorBox.style.display = 'none';
            errorMessage.textContent = '';

            if (mode === 'admin') {
                adminButton.style.background = 'var(--primary-red)';
                adminButton.style.color = 'white';
                userButton.style.background = 'transparent';
                userButton.style.color = 'var(--text-main)';

                heading.textContent = 'Admin Portal Login';
                subheading.textContent = 'Secure portal access for Musafir system administrators';
                emailInput.placeholder = 'admin@musafir.com';

                googleSection.style.display = 'none';
                submitButton.innerHTML = 'ADMIN SIGN IN <i class="fas fa-arrow-right"></i>';
            } else {
                userButton.style.background = 'var(--primary-red)';
                userButton.style.color = 'white';
                adminButton.style.background = 'transparent';
                adminButton.style.color = 'var(--text-main)';

                heading.textContent = 'Customer Login';
                subheading.textContent = 'Sign in to access your bookings, tickets, and wallet';
                emailInput.placeholder = 'name@example.com';

                googleSection.style.display = 'block';
                submitButton.innerHTML = 'SIGN IN <i class="fas fa-arrow-right"></i>';
            }

            emailInput.value = '';
            passwordInput.value = '';
        }
    </script>

</body>
</html>
